<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>바이올린 마스터</title>
<meta name="description" content="바이올린 마스터 시리즈: 악보, 튜너, 메트로놈">
<meta name="theme-color" content="#2b1f16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="바이올린 마스터">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&family=Outfit:wght@500;600&display=swap">
<style>
/* Layout: 가운데 한 열. 위에 f마크와 VIOLIN MASTER, 큰 제목, 그 아래 앱 타일 격자(아이폰 홈 화면처럼),
   맨 아래 최근 본 악보 몇 곡. */
:root {
  --bg: #f4efe8; --surface: #fffcf8; --surface-2: #f1e8dc; --line: #e2d6c7;
  --ink: #2b1f16; --muted: #7c6b5c; --accent: #7a4a26;
  --shadow: 0 1px 2px rgba(62,36,18,.06), 0 10px 28px rgba(62,36,18,.08); --edge: transparent;
  --f-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-title: "Noto Serif KR", "Nanum Myeongjo", Georgia, serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #14100d; --surface: #1d1814; --surface-2: #29221c; --line: #382e26; --ink: #f2e9df; --muted: #a8988a; --accent: #d9a877;
  --shadow: none; --edge: var(--line); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #14100d; --surface: #1d1814; --surface-2: #29221c; --line: #382e26; --ink: #f2e9df; --muted: #a8988a; --accent: #d9a877;
  --shadow: none; --edge: var(--line); color-scheme: dark }
* { box-sizing: border-box }
html, body { margin: 0; background: var(--bg) }
body { color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent }
[hidden] { display: none !important }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px;
  padding: calc(40px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(32px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
.hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px }
.hero svg { width: 18px; height: 36px; color: var(--accent) }
.wm { font: 600 13px Georgia, "Times New Roman", serif; letter-spacing: .34em; color: var(--accent); margin-right: -.34em }
h1 { margin: 0; font-family: var(--f-title); font-size: 34px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2 }
.sub { margin: 0; color: var(--muted); font-size: 14px }
.apps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px 10px; background: var(--surface); border: 1px solid var(--edge); border-radius: 26px; padding: 24px 12px 20px; box-shadow: var(--shadow) }
.app-tile { display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; color: inherit; border-radius: 18px; padding: 4px 0; min-width: 0 }
.app-tile img { width: 68px; height: 68px; border-radius: 15px; box-shadow: 0 6px 16px rgba(43,31,22,.18); transition: transform .15s }
.app-tile:active img { transform: scale(.94) }
.app-tile b { font-size: 14px; font-weight: 700 }
.app-tile small { font-size: 11.5px; color: var(--muted); margin-top: -6px; text-align: center; line-height: 1.35 }
.app-tile.soon { pointer-events: none }
.app-tile.soon img { filter: saturate(.25); opacity: .55; box-shadow: none }
.app-tile.soon small { color: var(--accent); font-weight: 700 }
@media (max-width: 380px) { .app-tile img { width: 58px; height: 58px; border-radius: 13px } .apps { gap: 16px 4px } }
.card { background: var(--surface); border: 1px solid var(--edge); border-radius: 22px; padding: 16px 18px; box-shadow: var(--shadow) }
h2 { margin: 0 0 6px; font-family: var(--f-title); font-size: 17px }
.recent { list-style: none; margin: 0; padding: 0 }
.recent li + li { border-top: 1px solid var(--line) }
.recent a { display: flex; align-items: center; gap: 12px; padding: 10px 0; color: inherit; text-decoration: none }
.recent .t { flex: 1; min-width: 0 }
.recent b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--f-title) }
.recent small { color: var(--muted); font-size: 12px }
.recent .bpm { font-family: "Outfit", sans-serif; font-weight: 600; font-size: 13px; color: #8a2f2a; background: #f1dcd6; padding: 3px 9px; border-radius: 999px; white-space: nowrap }
:root[data-theme="dark"] .recent .bpm { color: #df8a7c; background: #3a201b }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .recent .bpm { color: #df8a7c; background: #3a201b } }
.foot { text-align: center; color: var(--muted); font-size: 12px; margin: 0 }
</style>
</head>
<body>
<main class="wrap">
  <header class="hero">
    <svg viewBox="0 0 24 48" aria-hidden="true">
      <path d="M16.2 8.2C12.6 13.6 16.6 19.4 12 24s-.6 10.6-4.2 15.8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="16.6" cy="6" r="3" fill="currentColor"/><circle cx="7.4" cy="42" r="3" fill="currentColor"/>
      <path d="M8.4 22.6l-3 1.2M15.6 25.4l3-1.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span class="wm">VIOLIN MASTER</span>
    <h1>바이올린 마스터</h1>
    <p class="sub">악보를 보고, 줄을 맞추고, 박에 맞춰 연습해요</p>
  </header>

  <nav class="apps" aria-label="앱">
    <a class="app-tile" href="score/"><img src="score/icons/icon-192.png" alt=""><b>악보</b><small>모으고 보고<br>보잉 적기</small></a>
    <a class="app-tile" href="tuner/"><img src="tuner/icons/icon-192.png" alt=""><b>튜너</b><small>G·D·A·E<br>줄 맞추기</small></a>
    <a class="app-tile" href="tempo/"><img src="tempo/icons/icon-192.png" alt=""><b>메트로놈</b><small>강세·템포<br>올리기</small></a>
    <span class="app-tile soon" aria-disabled="true"><img src="icons/record-192.png" alt=""><b>녹음</b><small>곧 나와요</small></span>
  </nav>

  <section class="card" id="recentCard" hidden>
    <h2>최근 본 악보</h2>
    <ul class="recent" id="recent"></ul>
  </section>

  <p class="foot">모든 앱이 이 기기 안에 저장해요. 한 번 열어 두면 인터넷 없이도 열려요.</p>
</main>
<script>
'use strict';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// 악보 앱의 저장소에서 최근 본 곡을 읽어요 (같은 주소라 바로 열려요). 없으면 아무것도 안 보여요.
function recent() {
  const r = indexedDB.open('violin-sheets');
  r.onupgradeneeded = () => r.transaction.abort();
  r.onsuccess = () => {
    const d = r.result;
    if (!d.objectStoreNames.contains('scores')) { d.close(); return; }
    const g = d.transaction('scores').objectStore('scores').getAll();
    g.onsuccess = () => {
      d.close();
      const list = g.result.filter(s => s.openedAt).sort((a, b) => b.openedAt - a.openedAt).slice(0, 3);
      if (!list.length) return;
      document.getElementById('recent').innerHTML = list.map(s =>
        `<li><a href="score/" data-id="${esc(s.id)}"><span class="t"><b>${esc(s.title)}</b><small>${esc(s.composer || '')}${s.composer ? ' · ' : ''}${s.pages}쪽</small></span>${s.bpm ? `<span class="bpm">♩ ${s.bpm}</span>` : ''}</a></li>`).join('');
      document.getElementById('recentCard').hidden = false;
    };
  };
}
document.getElementById('recent').addEventListener('click', e => {
  const a = e.target.closest('[data-id]'); if (!a) return;
  try { sessionStorage.setItem('vm-sheets:reopen', JSON.stringify({ id: a.dataset.id })); } catch {}
});
try { recent(); } catch {}
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
