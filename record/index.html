<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Serif+KR:wght@600;700&family=Outfit:wght@400;500;600;700&display=swap">
<style>
/* Layout: 한 열(최대 560px). 위에 로고줄과 큰 제목, 녹음 카드(곡 고르기, 물결, 시간, 큰 빨간 단추),
   그 아래 녹음 목록(날짜별). 목록의 한 줄을 누르면 그 자리에서 펼쳐져 재생·속도·음정 분석·이름 바꾸기. 강조색은 미드나잇 블루 하나, 녹음 중 표시만 빨강. */
:root {
  --bg: #f4efe8; --surface: #fffcf8; --surface-2: #f1e8dc; --line: #e2d6c7;
  --ink: #2b1f16; --muted: #7c6b5c;
  --accent: #34507f; --accent-ink: #f6ecdc; --accent-soft: #dfe5f0; --glow: rgba(52,80,127,.28);
  --rec: #c2412f; --good: #3d8a55; --warn: #c08a1e; --bad: #c2412f;
  --shadow: 0 1px 2px rgba(62,36,18,.06), 0 10px 28px rgba(62,36,18,.08); --edge: transparent;
  --f-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-title: "Noto Serif KR", "Nanum Myeongjo", Georgia, serif;
  --f-num: "Outfit", "Noto Sans KR", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #14100d; --surface: #1d1814; --surface-2: #29221c; --line: #382e26; --ink: #f2e9df; --muted: #a8988a;
  --accent: #93a9d6; --accent-ink: #101a2e; --accent-soft: #1e2738; --glow: rgba(147,169,214,.22);
  --rec: #e46b57; --good: #6fbf86; --warn: #e0b04a; --bad: #e46b57;
  --shadow: none; --edge: var(--line); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #14100d; --surface: #1d1814; --surface-2: #29221c; --line: #382e26; --ink: #f2e9df; --muted: #a8988a;
  --accent: #93a9d6; --accent-ink: #101a2e; --accent-soft: #1e2738; --glow: rgba(147,169,214,.22);
  --rec: #e46b57; --good: #6fbf86; --warn: #e0b04a; --bad: #e46b57;
  --shadow: none; --edge: var(--line); color-scheme: dark }
* { box-sizing: border-box }
html, body { margin: 0; background: var(--bg) }
body { color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent }
[hidden] { display: none !important }
button, select, input { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px;
  padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
.top { padding-top: 8px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px }
.top > div { min-width: 0 }
.lockup { display: flex; align-items: center; gap: 8px; margin: 0 0 2px; color: var(--accent); white-space: nowrap; text-decoration: none }
.lockup svg { width: 10px; height: 20px }
.lockup .wm { font: 600 11.5px Georgia, "Times New Roman", serif; letter-spacing: .3em }
.lockup .lk-app { font-size: 12px; font-weight: 700; color: var(--muted); padding-left: 9px; border-left: 1px solid var(--line) }
h1 { margin: 0; font-family: var(--f-title); font-size: 34px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2 }
h2 { margin: 0; font-family: var(--f-title); font-size: 17px; font-weight: 700 }
.card { background: var(--surface); border: 1px solid var(--edge); border-radius: 22px; padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; min-width: 0 }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap }
.spacer { flex: 1 }
.note { font-size: 13px; color: var(--muted); margin: 0 }
.btn { border: 0; background: var(--surface-2); font-weight: 700; font-size: 14px; padding: 0 16px; height: 40px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; text-decoration: none; color: var(--ink) }
.btn.primary { background: var(--accent); color: var(--accent-ink) }
.btn.danger { color: var(--bad) }
.btn.armed { background: var(--bad); color: #fff }
.btn svg { width: 18px; height: 18px }
.iconbtn { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; cursor: pointer; color: var(--ink) }
.iconbtn svg { width: 20px; height: 20px }
.sel { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border-radius: 14px; padding: 0 12px; height: 46px }
.sel span { font-size: 12px; color: var(--muted); font-weight: 700; white-space: nowrap }
.sel select { flex: 1; min-width: 0; border: 0; background: transparent; height: 100%; font-weight: 700; appearance: none; -webkit-appearance: none; cursor: pointer }
.sel svg { width: 16px; height: 16px; color: var(--muted); pointer-events: none }

/* 녹음 카드 */
.rec { align-items: stretch }
.wave { width: 100%; height: 96px; display: block; border-radius: 14px; background: var(--surface-2) }
.clock { text-align: center; font-family: var(--f-num); font-size: 44px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -.01em }
.clock small { display: block; font-family: var(--f-body); font-size: 13px; color: var(--muted); font-weight: 500; letter-spacing: 0; margin-top: 8px; min-height: 20px }
.clock small.warn { color: var(--bad); font-weight: 700 }
.recbtn { align-self: center; width: 84px; height: 84px; border-radius: 50%; border: 4px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; padding: 0 }
.recbtn i { display: block; width: 58px; height: 58px; border-radius: 50%; background: var(--rec); transition: all .2s }
.recbtn.live { border-color: var(--rec) }
.recbtn.live i { width: 30px; height: 30px; border-radius: 8px }
.recbtn:disabled { opacity: .5 }
.live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--rec); margin-right: 6px; animation: blink 1s infinite }
@keyframes blink { 50% { opacity: .2 } }

/* 목록 */
.listh { display: flex; align-items: center; gap: 10px; flex-wrap: wrap }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; max-width: 100% }
.chip { border: 0; height: 32px; padding: 0 12px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-weight: 700; font-size: 13px; cursor: pointer; white-space: nowrap }
.chip.on { background: var(--accent); color: var(--accent-ink) }
.day { font-size: 12px; font-weight: 700; color: var(--muted); margin: 6px 0 2px; letter-spacing: .02em }
.recs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column }
.recs > li { border-bottom: 1px solid var(--line) }
.recs > li:last-child { border-bottom: 0 }
.item { display: flex; align-items: center; gap: 12px; padding: 11px 0 }
.pbtn { width: 40px; height: 40px; flex: none; border-radius: 50%; border: 0; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; cursor: pointer }
.pbtn svg { width: 18px; height: 18px }
.item .t { flex: 1; min-width: 0; background: none; border: 0; padding: 0; text-align: left; cursor: pointer }
.item .t b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700 }
.item .t small { color: var(--muted); font-size: 12px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.score-tag { color: var(--accent); font-weight: 700 }
.star { width: 34px; height: 34px; flex: none; border: 0; background: none; cursor: pointer; color: var(--line); display: grid; place-items: center }
.star.on { color: #d29a2e }
.star svg { width: 20px; height: 20px }
.detail { padding: 2px 0 16px; display: flex; flex-direction: column; gap: 12px }
.seek { display: flex; align-items: center; gap: 10px; font-family: var(--f-num); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums }
.seek input { flex: 1; accent-color: var(--accent) }
.ov { width: 100%; height: 56px; display: block; cursor: pointer }
.graph { width: 100%; height: 190px; display: block; cursor: pointer }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px }
.seg button { border: 0; background: transparent; height: 32px; padding: 0 11px; border-radius: 999px; font-weight: 700; font-size: 13px; color: var(--muted); cursor: pointer; font-family: var(--f-num) }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.12) }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px }
.stat { background: var(--surface-2); border-radius: 14px; padding: 10px 12px }
.stat span { display: block; font-size: 11.5px; color: var(--muted); font-weight: 700 }
.stat b { font-family: var(--f-num); font-size: 20px; font-weight: 600 }
.tinput { height: 42px; border-radius: 12px; border: 0; background: var(--surface-2); padding: 0 12px; width: 100%; font-weight: 700 }
.empty { text-align: center; padding: 26px 10px; color: var(--muted) }
.empty b { display: block; color: var(--ink); font-family: var(--f-title); font-size: 17px; margin-bottom: 4px }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(10px); background: #2b1f16; color: #fffaf3; padding: 11px 18px; border-radius: 14px; font-size: 14px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; max-width: calc(100vw - 32px); text-align: center; z-index: 9 }
.toast.show { opacity: 1; transform: translateX(-50%) }
.family { display: flex; justify-content: center; gap: 18px; font-size: 13px; color: var(--muted); flex-wrap: wrap }
.family a { color: inherit; text-decoration: none; display: inline-flex; align-items: center; gap: 6px }
.family img { width: 22px; height: 22px; border-radius: 5px }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="fhole" viewBox="0 0 24 48">
    <path d="M16.2 8.2C12.6 13.6 16.6 19.4 12 24s-.6 10.6-4.2 15.8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="16.6" cy="6" r="3" fill="currentColor"/><circle cx="7.4" cy="42" r="3" fill="currentColor"/>
    <path d="M8.4 22.6l-3 1.2M15.6 25.4l3-1.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5.5" width="4" height="13" rx="1.2" fill="currentColor"/><rect x="13.5" y="5.5" width="4" height="13" rx="1.2" fill="currentColor"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9l-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z" fill="currentColor"/></symbol>

<main class="wrap">
  <header class="top">
    <div>
      <a class="lockup" href="../"><svg aria-hidden="true"><use href="#fhole"/></svg><span class="wm">VIOLIN MASTER</span><span class="lk-app">녹음</span></a>
      <h1>녹음</h1>
    </div>
    <button class="iconbtn" id="importBtn" aria-label="녹음 파일 불러오기"><svg><use href="#i-file"/></svg></button>
    <input type="file" id="fileIn" accept="audio/*,video/mp4,.m4a,.mp3,.wav,.webm" hidden>
  </header>

  <section class="card rec">
    <label class="sel"><span>무슨 곡?</span><select id="scoreSel"><option value="">곡 고르지 않음</option></select><svg><use href="#i-down"/></svg></label>
    <canvas class="wave" id="wave" aria-hidden="true"></canvas>
    <div class="clock"><span id="clock">00:00</span><small id="recHint">빨간 단추를 누르면 녹음이 시작돼요</small></div>
    <button class="recbtn" id="recBtn" aria-label="녹음 시작"><i></i></button>
  </section>

  <section class="card">
    <div class="listh"><h2>녹음 목록</h2><span class="spacer"></span><div class="chips" id="chips"></div></div>
    <div id="list"></div>
    <div class="empty" id="empty" hidden><b>아직 녹음이 없어요</b>연주를 녹음해 두면 여기서 다시 듣고 음정을 살펴볼 수 있어요.</div>
    <p class="note" id="storage"></p>
  </section>

  <nav class="family" aria-label="시리즈 앱">
    <a href="../score/"><img src="../score/icons/icon-192.png" alt="">악보</a>
    <a href="../tuner/"><img src="../tuner/icons/icon-192.png" alt="">튜너</a>
    <a href="../tempo/"><img src="../tempo/icons/icon-192.png" alt="">메트로놈</a>
  </nav>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('vm:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('vm:' + k, JSON.stringify(v)); } catch {} }
};
let toastT;
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }
const fmt = sec => { sec = Math.max(0, Math.floor(sec || 0)); const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = sec % 60; return (h ? h + ':' + String(m).padStart(2, '0') : String(m).padStart(2, '0')) + ':' + String(s).padStart(2, '0'); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

/* 아이폰은 무음(벨소리) 스위치가 켜져 있으면 웹 소리를 꺼 버려요. 녹음과 재생을 함께 쓰는 앱이라고 알려서 무음 모드에서도 들리게 해요. */
let ctx = null;
function ac() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  try { if (navigator.audioSession) navigator.audioSession.type = 'play-and-record'; } catch {}
  if (ctx.state !== 'running') ctx.resume().catch(() => {});
  return ctx;
}

/* ---------- 저장소: 녹음은 이 기기의 'vm-recordings'에 보관 ----------
   recs: { id, title, scoreId, scoreTitle, at, dur, type, size, fav, data(ArrayBuffer), pitch? } */
const DB = {
  db: null,
  open() {
    return this.db ||= new Promise((res, rej) => {
      const r = indexedDB.open('vm-recordings', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('recs', { keyPath: 'id' });
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  },
  async tx(mode, fn) {
    const d = await this.open();
    return new Promise((res, rej) => { const t = d.transaction('recs', mode), q = fn(t.objectStore('recs')); t.oncomplete = () => res(q?.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
  },
  get: id => DB.tx('readonly', s => s.get(id)),
  put: v => DB.tx('readwrite', s => s.put(v)),
  del: id => DB.tx('readwrite', s => s.delete(id)),
  // 목록에는 소리 데이터 없이 정보만
  async list() {
    const d = await this.open();
    return new Promise((res, rej) => {
      const out = [], t = d.transaction('recs'), c = t.objectStore('recs').openCursor();
      c.onsuccess = () => { const cur = c.result; if (!cur) return; const { data, ...meta } = cur.value; out.push(meta); cur.continue(); };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error);
    });
  }
};

/* 악보 앱의 곡 목록 (같은 주소라 바로 읽어요). 없으면 빈 목록. */
function readScores() {
  return new Promise(res => {
    let r; try { r = indexedDB.open('violin-sheets'); } catch { return res([]); }
    r.onupgradeneeded = () => r.transaction.abort();
    r.onerror = () => res([]);
    r.onsuccess = () => {
      const d = r.result; if (!d.objectStoreNames.contains('scores')) { d.close(); return res([]); }
      const g = d.transaction('scores').objectStore('scores').getAll();
      g.onsuccess = () => { d.close(); res(g.result); }; g.onerror = () => { d.close(); res([]); };
    };
  });
}

/* 예전 연습 앱(같은 주소)에 녹음이 남아 있으면 한 번만 옮겨 와요 */
function importOld() {
  if (store.get('rec-imported', false)) return Promise.resolve(0);
  return new Promise(res => {
    let r; try { r = indexedDB.open('violin-master'); } catch { return res(0); }
    r.onupgradeneeded = () => r.transaction.abort();
    r.onerror = () => { store.set('rec-imported', true); res(0); };
    r.onsuccess = () => {
      const d = r.result; if (!d.objectStoreNames.contains('recs')) { d.close(); store.set('rec-imported', true); return res(0); }
      const g = d.transaction('recs').objectStore('recs').getAll();
      g.onsuccess = async () => {
        d.close(); let n = 0;
        for (const o of g.result) {
          if (!(o.blob instanceof Blob)) continue;
          await DB.put({ id: 'old-' + o.id, title: o.title || '예전 녹음', scoreId: '', scoreTitle: '', at: o.at || Date.now(), dur: o.seconds || 0, type: o.blob.type || 'audio/webm', size: o.blob.size, fav: false, data: await o.blob.arrayBuffer() });
          n++;
        }
        store.set('rec-imported', true); res(n);
      };
      g.onerror = () => { d.close(); res(0); };
    };
  });
}

/* ---------- 곡 고르기 ---------- */
const q = new URLSearchParams(location.search);
let scores = [];
async function loadScores() {
  scores = (await readScores()).sort((a, b) => (b.openedAt || 0) - (a.openedAt || 0));
  const want = q.get('score') || store.get('rec-score', '');
  $('scoreSel').innerHTML = '<option value="">곡 고르지 않음</option>' + scores.map(s => `<option value="${esc(s.id)}">${esc(s.title)}${s.composer ? ' · ' + esc(s.composer) : ''}</option>`).join('');
  if (want && scores.some(s => s.id === want)) $('scoreSel').value = want;
}
$('scoreSel').onchange = () => store.set('rec-score', $('scoreSel').value);

/* ---------- 녹음 ---------- */
const MAX_SEC = 30 * 60;
let mr = null, chunks = [], stream = null, t0 = 0, tick = 0, an = null, wake = null, peaks = [];
function pickMime() {
  for (const m of ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus'])
    if (window.MediaRecorder?.isTypeSupported?.(m)) return m;
  return '';
}
async function startRec() {
  if (!window.MediaRecorder || !navigator.mediaDevices?.getUserMedia) { toast('이 브라우저는 녹음을 못 해요. 휴대폰 녹음 앱으로 녹음한 뒤 오른쪽 위 파일 단추로 불러오세요.'); return; }
  const c = ac();

  for (const c of [50, 25, 0, -25, -50]) { g.strokeStyle = css('--line'); g.lineWidth = c === 0 ? 1.5 : 1; g.beginPath(); g.moveTo(L, y(c)); g.lineTo(w - R, y(c)); g.stroke(); g.fillText((c > 0 ? '+' : '') + c, L - 6, y(c)); }
  g.textAlign = 'center'; g.textBaseline = 'top';
  const step = dur > 180 ? 60 : dur > 60 ? 15 : dur > 20 ? 5 : 2;
  for (let t = 0; t <= dur; t += step) g.fillText(fmt(t), xs(t), h - B + 7);
  for (const p of pitch.pts) { const a = Math.abs(p.c); g.fillStyle = css(a <= 10 ? '--good' : a <= 25 ? '--warn' : '--bad'); g.fillRect(xs(p.t) - 1.25, y(p.c) - 1.25, 2.5, 2.5); }
  if (playingId === openRec?.id && player.currentTime) { g.strokeStyle = css('--accent'); g.lineWidth = 2; g.beginPath(); g.moveTo(xs(player.currentTime), T); g.lineTo(xs(player.currentTime), h - B); g.stroke(); }
}
addEventListener('resize', () => { drawWave(); drawOverview(); drawGraph(); });

/* ---------- 기타 ---------- */
function armDanger(btn, armedText, fn) {
  let armed = false, t = 0; const orig = btn.textContent;
  btn.onclick = () => {
    if (armed) { clearTimeout(t); fn(); return; }
    armed = true; btn.textContent = armedText; btn.classList.add('armed');
    t = setTimeout(() => { armed = false; btn.textContent = orig; btn.classList.remove('armed'); }, 3000);
  };
}
async function storageNote() {
  const total = all.reduce((s, r) => s + (r.size || 0), 0);
  let txt = all.length ? `녹음 ${all.length}개 · ${(total / 1048576).toFixed(1)}MB. 이 기기 안에만 있어요. 중요한 녹음은 내려받아 두세요.` : '';
  $('storage').textContent = txt;
}
function requestPersist() { try { navigator.storage?.persist?.(); } catch {} }
document.addEventListener('visibilitychange', async () => { if (document.visibilityState === 'visible' && mr) { try { wake = await navigator.wakeLock?.request('screen'); } catch {} } });
addEventListener('beforeunload', e => { if (mr) { e.preventDefault(); e.returnValue = ''; } });

(async () => {
  drawWave();
  try {
    await loadScores();
    const n = await importOld();
    await render();
    if (n) toast(`예전 연습 앱의 녹음 ${n}개를 옮겨 왔어요`);
    if (q.get('score') && $('scoreSel').value) setHint(`'${$('scoreSel').selectedOptions[0].textContent}' 녹음 준비됐어요`);
  } catch (e) { console.error(e); toast('이 브라우저에서는 기기 저장을 쓸 수 없어요'); }
})();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
